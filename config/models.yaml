endpoints:
  local:
    url: http://localhost:11434
    model: qwen3-coder:30b   # DEFAULT as of Finding 21/21b - 8/10 reached
    # real Godot validation (vs 4/10 for the 14B, even with the same
    # tightened prompt), competitive speed (100-250s/task), MoE
    # architecture fits this hardware's 24GB cleanly (12%/88% CPU/GPU
    # split, best of any model tried). Swap back to qwen2.5-coder:14b
    # only for fast iteration/debugging where raw speed matters more
    # than quality.
routing:
  planner: [local]
  coder: [local]
  reviewer: [local]  # RE-ENABLED for a clean re-test - the original
  # failure (Finding 19) was a 14B reviewing a 14B and self-contradicting
  # (issue 93). Now testing whether a 30B reviewer (same model as the
  # coder, avoiding cross-model swap latency) makes more reliable calls.
  # If this also proves unreliable, the code stays and this line gets
  # commented out again with the new evidence documented.
options:
  temperature: 0.2
  num_ctx: 16384
github:
  repo: AwenArch/zac-godot-sandbox   # <-- EDIT: your GitHub username
  keychain_account: zac
  keychain_service: agent-gh-pat
