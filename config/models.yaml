endpoints:
  local:
    url: http://localhost:11434
    model: qwen3-coder:30b   # DEFAULT as of Finding 21/21b - 8/10 reached
    # real Godot validation (vs 4/10 for the 14B, even with the same
    # tightened prompt), competitive speed (100-250s/task), MoE
    # architecture fits this hardware's 24GB cleanly (12%/88% CPU/GPU
    # split, best of any model tried). Swap back to qwen2.5-coder:14b
    # only for fast iteration/debugging where raw speed matters more
    # than quality.
routing:
  planner: [local]
  coder: [local]
  # reviewer: [local]  # DISABLED by default - reviewer-v1 bench showed
  # self-contradictory rejections on the same task (issue 93: told coder
  # to hardcode values, then reversed itself and demanded GameConfig reads
  # - directly undoing the task's own goal) and a likely false-positive
  # 'unused variable' flag on issue 84. Same-class-model review risk that
  # motivated deprioritizing 0b originally, now confirmed with evidence.
  # Re-enable only behind an explicit flag, or once reviewed by a
  # stronger/different model than the coder.
options:
  temperature: 0.2
  num_ctx: 16384
github:
  repo: AwenArch/zac-godot-sandbox   # <-- EDIT: your GitHub username
  keychain_account: zac
  keychain_service: agent-gh-pat
