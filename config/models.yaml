endpoints:
  local:
    url: http://localhost:11434
    model: qwen3-coder:30b   # DEFAULT as of Finding 21/21b - 8/10 reached
    # real Godot validation (vs 4/10 for the 14B, even with the same
    # tightened prompt), competitive speed (100-250s/task), MoE
    # architecture fits this hardware's 24GB cleanly (12%/88% CPU/GPU
    # split, best of any model tried). Swap back to qwen2.5-coder:14b
    # only for fast iteration/debugging where raw speed matters more
    # than quality.
routing:
  planner: [local]
  coder: [local]
  artist: [local]
  # reviewer: [local]  # DISABLED again after a second clean test
  # (reviewer-30b-v2, v3). This time the 30B reviewer's individual
  # rejections were often genuinely correct (unlike Finding 19's 14B
  # self-contradiction) - but the coder+reviewer loop doesn't converge:
  # "reached Godot" stuck at 1/10 both with MAX_ATTEMPTS=5 and =7, and
  # giving more budget just increased tasks ending in permanent reviewer
  # deadlock (5/10 -> 7/10) instead of resolving them. Not a budget
  # problem - a convergence problem. Revisit only with a genuinely
  # different reviewer model, not more attempts of the same one.
options:
  temperature: 0.2
  num_ctx: 16384
github:
  repo: AwenArch/zac-godot-sandbox   # <-- EDIT: your GitHub username
  keychain_account: zac
  keychain_service: agent-gh-pat
